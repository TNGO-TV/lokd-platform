# Deploys LOKD from main using the build the security gate already validated.
# Runs only after "LOKD security gate" succeeds on a push to main: no second lint,
# build or test pass. It downloads that run's native-candidate artifact, verifies
# the receipt (same commit, config, evidence and artifact hashes), applies D1
# migrations, then deploys exactly that build with wrangler --no-bundle.
# Needs one repository secret: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit, D1: Edit, Account Settings: Read).
# Secrets set with `wrangler secret put` are untouched by a deploy (keep_vars: true).
name: LOKD deploy
on:
  workflow_run:
    workflows: ["LOKD security gate"]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
concurrency:
  group: lokd-deploy
  cancel-in-progress: false
jobs:
  deploy:
    name: migrate, deploy validated build
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LOKD_NATIVE_CF: '1'
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.22.1'
          package-manager-cache: false
      - name: Match the security gate's npm toolchain
        run: npm install --global npm@11.17.0
      - name: Install locked dependencies (for wrangler only)
        run: npm run install:ci
      - name: Download the validated candidate from the security gate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-candidate-${{ github.event.workflow_run.head_sha }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: .
      - name: Verify the candidate receipt before touching production
        run: node scripts/release-candidate.mjs verify
      - name: Apply D1 migrations
        run: ./node_modules/.bin/wrangler d1 migrations apply lokd-security --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy the validated build
        run: bash scripts/deploy-native-cf.sh --deploy-candidate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live readiness
        run: |
          sleep 10
          body="$(curl -sS --max-time 30 https://lokd.co.za/api/health/ready)"
          echo "$body"
          echo "$body" | grep -q '"status":"ready"'

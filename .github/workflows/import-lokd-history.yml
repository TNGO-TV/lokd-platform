name: Import original LOKD Version 35 history

on:
  push:
    branches: [main]
    paths:
      - import/LOKD-v35-full-history.bundle
      - import/manifest.json
      - .github/workflows/import-lokd-history.yml

permissions:
  contents: write

concurrency:
  group: lokd-version-35-history-import
  cancel-in-progress: false

jobs:
  import-history:
    if: github.repository == 'zenascapetown-code/lokd-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify archive and restore original Git objects
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_BUNDLE_SHA256: 21ebdac4f664c0c6d69aaaedadf48e0f4907f1ba5f71d74f045970906ae5a3aa
          EXPECTED_SOURCE_TREE: 72e4cb365a0d2e6a2c369612b912095dd0511d6e
          EXPECTED_BOOTSTRAP_SHA: c7e324efee7e683429492a0c8c2abaf680834818
        shell: bash
        run: |
          python - <<'PYTHON'
          """Restore the original LOKD Git objects into two new, private recovery refs."""

          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import tempfile
          import urllib.request


          REPOSITORY = "zenascapetown-code/lokd-platform"
          SOURCE_HEAD = "0ac50b677d302d748fc3d29eebcbf42ba5bd3e2b"
          SOURCE_COMMITS = 38
          SOURCE_FILES = 219
          REMOTE = f"https://github.com/{REPOSITORY}.git"
          RELEASE_REF = "refs/heads/release/version-35"
          ARCHIVE_REF = "refs/heads/import/archive-version-35"


          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)


          def main():
              require(os.environ.get("GITHUB_REPOSITORY") == REPOSITORY, "Wrong repository")
              require(os.environ.get("GITHUB_EVENT_NAME") == "push", "Expected a push event")
              require(os.environ.get("GITHUB_REF") == "refs/heads/main", "Expected the import branch")
              trigger_sha = os.environ["GITHUB_SHA"]
              require(re.fullmatch(r"[0-9a-f]{40}", trigger_sha), "Invalid triggering revision")
              token = os.environ["GH_TOKEN"]
              expected_digest = os.environ["EXPECTED_BUNDLE_SHA256"]
              expected_tree = os.environ["EXPECTED_SOURCE_TREE"]
              bootstrap_sha = os.environ["EXPECTED_BOOTSTRAP_SHA"]
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{REPOSITORY}",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "LOKD-history-import",
                  },
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  metadata = json.load(response)
              require(metadata.get("private") is True, "Repository must remain private")
              require(metadata.get("full_name") == REPOSITORY, "Unexpected destination")
              require(metadata.get("default_branch") == "main", "Unexpected default branch")

              basic_auth = base64.b64encode(f"x-access-token:{token}".encode()).decode()
              git_environment = os.environ.copy()
              git_environment.update({
                  "GIT_CONFIG_COUNT": "1",
                  "GIT_CONFIG_KEY_0": "http.https://github.com/.extraheader",
                  "GIT_CONFIG_VALUE_0": f"AUTHORIZATION: basic {basic_auth}",
                  "GIT_TERMINAL_PROMPT": "0",
              })

              with tempfile.TemporaryDirectory(prefix="lokd-history-") as temporary:
                  workspace = Path(temporary)
                  repository = workspace / "repository.git"

                  def git(*arguments, binary=False):
                      command = ["git"]
                      if repository.exists():
                          command += ["--git-dir", str(repository)]
                      result = subprocess.run(
                          command + list(arguments),
                          env=git_environment,
                          capture_output=True,
                          check=False,
                      )
                      if result.returncode:
                          error = result.stderr.decode(errors="replace")
                          error = error.replace(token, "[redacted]").replace(basic_auth, "[redacted]")
                          raise RuntimeError(f"Git command failed: {error}")
                      return result.stdout if binary else result.stdout.decode().strip()

                  git("clone", "--bare", "--no-tags", REMOTE, str(repository))
                  require(git("rev-parse", "refs/heads/main") == trigger_sha, "Main changed during preparation")
                  require(git("rev-parse", f"{trigger_sha}^") == bootstrap_sha, "Unexpected import parent")
                  paths = set(git("ls-tree", "-r", "--name-only", trigger_sha).splitlines())
                  require(paths == {
                      "IMPORT.md",
                      ".github/workflows/import-lokd-history.yml",
                      "import/manifest.json",
                      "import/LOKD-v35-full-history.bundle",
                  }, "Unexpected files in the import checkpoint")
                  manifest = json.loads(git("show", f"{trigger_sha}:import/manifest.json"))
                  require(manifest["repository"] == REPOSITORY, "Unexpected manifest destination")
                  require(manifest["source_head"] == SOURCE_HEAD, "Unexpected source revision")
                  require(manifest["source_tree"] == expected_tree, "Unexpected source tree")
                  require(manifest["commit_count"] == SOURCE_COMMITS, "Unexpected history count")
                  require(manifest["tracked_file_count"] == SOURCE_FILES, "Unexpected file count")
                  require(manifest["bundle_sha256"] == expected_digest, "Unexpected archive digest")
                  bundle = workspace / "source.bundle"
                  data = git("show", f"{trigger_sha}:import/LOKD-v35-full-history.bundle", binary=True)
                  require(hashlib.sha256(data).hexdigest() == expected_digest, "Archive integrity check failed")
                  require(len(data) == manifest["bundle_bytes"], "Archive size mismatch")
                  bundle.write_bytes(data)
                  git("bundle", "verify", str(bundle))
                  candidate_ref = "refs/heads/lokd-import-candidate"
                  git("fetch", "--no-tags", str(bundle), f"refs/heads/main:{candidate_ref}")
                  require(git("rev-parse", candidate_ref) == SOURCE_HEAD, "Source commit changed")
                  require(git("rev-parse", f"{candidate_ref}^{{tree}}") == expected_tree, "Source files changed")
                  require(int(git("rev-list", "--count", candidate_ref)) == SOURCE_COMMITS, "Incomplete history")
                  require(len(git("ls-tree", "-r", "--name-only", candidate_ref).splitlines()) == SOURCE_FILES,
                          "Incomplete source tree")
                  git("fsck", "--full")

                  # Both destinations are new refs. A conflicting existing ref stops the
                  # import. The workflow never changes main and never executes source code.
                  git(
                      "push", "--atomic",
                      f"--force-with-lease={RELEASE_REF}:",
                      f"--force-with-lease={ARCHIVE_REF}:",
                      REMOTE,
                      f"{SOURCE_HEAD}:{RELEASE_REF}",
                      f"{trigger_sha}:{ARCHIVE_REF}",
                  )
                  restored = {}
                  for line in git("ls-remote", REMOTE, RELEASE_REF, ARCHIVE_REF).splitlines():
                      sha, ref = line.split()
                      restored[ref] = sha
                  require(restored.get(RELEASE_REF) == SOURCE_HEAD, "Remote source verification failed")
                  require(restored.get(ARCHIVE_REF) == trigger_sha, "Import archive verification failed")
                  summary = {
                      "repository": REPOSITORY,
                      "source_head": SOURCE_HEAD,
                      "source_tree": expected_tree,
                      "commits": SOURCE_COMMITS,
                      "tracked_files": SOURCE_FILES,
                      "release_ref": RELEASE_REF,
                      "archive_ref": ARCHIVE_REF,
                      "main_unchanged": True,
                  }
                  print(json.dumps(summary, indent=2))
                  summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
                  if summary_path:
                      Path(summary_path).write_text(
                          "LOKD Version 35 source import verified.\n\n"
                          f"Original commit: `{SOURCE_HEAD}`\n\n"
                          f"Original history: {SOURCE_COMMITS} commits, {SOURCE_FILES} files.\n\n"
                          "Source objects and the import archive are now preserved in private branches.\n"
                      )


          if __name__ == "__main__":
              main()
          PYTHON
